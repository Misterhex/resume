name: Build Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Generate PDF
        run: |
          pandoc README.md -o resume.pdf \
            --pdf-engine=pdflatex \
            -V geometry:margin=0.75in \
            -V fontsize=11pt \
            -V colorlinks=true

      - name: Prepare site
        run: |
          mkdir -p _site
          cp README.md _site/resume.md
          cp resume.pdf _site/resume.pdf
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><title>Resume - Tan Yong Heng</title></head>
          <body style="font-family: sans-serif; max-width: 600px; margin: 80px auto; text-align: center;">
            <h1>Resume</h1>
            <p><a href="resume.pdf">Download PDF</a></p>
            <p><a href="resume.md">Download Markdown</a></p>
          </body>
          </html>
          HTMLEOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
